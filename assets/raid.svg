<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',Georgia,serif" text-anchor="middle" dominant-baseline="central" xmlns:c2pa="http://c2pa.org/manifest">
<defs><pattern id="g" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#94ba72"/><rect width="40" height="40" fill="#9fc47c"/><rect x="40" y="40" width="40" height="40" fill="#9fc47c"/></pattern></defs>
<rect width="600" height="360" fill="url(#g)"/>
<rect width="600" height="360" fill="#6e2814" opacity=".25"/>

<!-- enemy towers -->
<g stroke="rgba(0,0,0,.5)"><rect x="242" y="82" width="36" height="36" fill="#9aa1a8"/><rect x="242" y="242" width="36" height="36" fill="#9aa1a8"/></g>
<text x="260" y="101" font-size="26">🗼</text><text x="260" y="261" font-size="26">🗼</text>

<!-- enemy buildings that burn -->
<g font-size="26">
<g><text x="380" y="60">🏠</text><text x="380" y="60" opacity="0">🔥<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.55;.95;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><text x="420" y="140">🌾</text><text x="420" y="140" opacity="0">🔥<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.63;.95;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><text x="380" y="240">🏠</text><text x="380" y="240" opacity="0">🔥<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.69;.95;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><text x="500" y="100">🌾</text><text x="500" y="100" opacity="0">🔥<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.7;.75;.95;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><text x="500" y="270">🏠</text><text x="500" y="270" opacity="0">🔥<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.76;.81;.95;1" dur="12s" repeatCount="indefinite"/></text></g>
</g>

<!-- enemy keep and flag -->
<text x="460" y="180" font-size="40">🏯<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.84;.86;.99;1" dur="12s" repeatCount="indefinite"/></text>
<text x="460" y="180" font-size="40" opacity="0">🚩<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.84;.86;.95;1" dur="12s" repeatCount="indefinite"/></text>

<!-- tower shots -->
<g stroke="#fff" stroke-width="2" opacity="0">
<line x1="260" y1="100" x2="190" y2="120"><animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;.12;.15;.18;.21;.24;1" dur="12s" repeatCount="indefinite"/></line>
<line x1="260" y1="260" x2="190" y2="240"><animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;.12;.15;.18;.21;.24;1" dur="12s" repeatCount="indefinite"/></line>
</g>

<!-- skulls where two soldiers fell -->
<g font-size="22"><text x="190" y="120" opacity="0">💀<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.24;.27;.95;1" dur="12s" repeatCount="indefinite"/></text>
<text x="190" y="240" opacity="0">💀<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.24;.27;.95;1" dur="12s" repeatCount="indefinite"/></text></g>

<!-- soldiers: two fall at the towers, three reach the keep -->
<g font-size="24">
<g><text>⚔️</text><animateTransform attributeName="transform" type="translate" values="30 120;190 120;190 120" keyTimes="0;.24;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.24;.27;1" dur="12s" repeatCount="indefinite"/></g>
<g><text>⚔️</text><animateTransform attributeName="transform" type="translate" values="30 240;190 240;190 240" keyTimes="0;.24;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.24;.27;1" dur="12s" repeatCount="indefinite"/></g>
<g><text>⚔️</text><animateTransform attributeName="transform" type="translate" values="30 60;410 160;410 160;410 160" keyTimes="0;.45;.95;1" dur="12s" repeatCount="indefinite"/></g>
<g><text>⚔️</text><animateTransform attributeName="transform" type="translate" values="30 180;412 180;412 180;412 180" keyTimes="0;.45;.95;1" dur="12s" repeatCount="indefinite"/></g>
<g><text>⚔️</text><animateTransform attributeName="transform" type="translate" values="30 300;410 200;410 200;410 200" keyTimes="0;.45;.95;1" dur="12s" repeatCount="indefinite"/></g>
</g>

<rect width="600" height="30" fill="#000" opacity=".55"/>
<text x="300" y="15" font-size="15" fill="#fff" font-weight="bold">⚔️ Штурм: Форт Рейвенхолл</text>
<text x="300" y="180" font-size="40" font-weight="bold" fill="#ffd34d" stroke="rgba(0,0,0,.7)" stroke-width="4" paint-order="stroke" opacity="0" transform="translate(0 70)">Победа!<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.88;.92;.97;1" dur="12s" repeatCount="indefinite"/></text>
<rect y="326" width="600" height="34" fill="#000" opacity=".55"/>
<text x="300" y="343" font-size="15" fill="#fff" font-weight="bold">Рейд: захвати чужой город и получай дань</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
